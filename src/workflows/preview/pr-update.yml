# climaybe — PR Update (Optional Preview Package)
# Pushes a Shopify development theme on PR update (hidden from the main theme library),
# keyed by climaybe-pr-<n>, and posts preview / editor preview links back to the PR.
#
# Opt out of theme push for a PR or commit:
#   - PR label: skip-preview
#   - PR title or body contains: [skip-preview]
#   - Head commit message contains: [skip-preview]
#
# Refresh an expired development theme: comment `/redeploy` on the PR
# (see pr-preview-redeploy.yml).

name: PR Update

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main, staging, develop, 'staging-*', 'live-*']

# Draft PRs never build previews (PRs stay draft until Bugbot / cursor-review finish;
# `ready_for_review` then triggers the first preview). A newer push to the same PR
# cancels the in-flight preview run.
concurrency:
  group: pr-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Single job: filter + resolve store targets + push a dev theme per store
    # (sequential). Replaces ~5 + 2N tiny jobs that each billed a full minute.
    # Skip drafts entirely; ignore unrelated label churn.
    if: >
      github.event.pull_request.draft == false && (
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'skip-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists PR files through the Pull Request API.
      pull-requests: read
      actions: write
    outputs:
      theme: ${{ steps.decide.outputs.theme }}
      skip_preview: ${{ steps.decide.outputs.skip_preview }}
      pr_number: ${{ github.event.pull_request.number }}
      store_alias: ${{ steps.resolve.outputs.store_alias }}
      store_alias_secret: ${{ steps.resolve.outputs.store_alias_secret }}
      theme_id: ${{ steps.push.outputs.theme_id }}
      share_output: ${{ steps.push.outputs.share_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Detect skip-preview opt-out
        id: skip
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-preview') }}
        run: |
          SKIP=false
          REASON=""

          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            SKIP=true
            REASON="PR has label skip-preview"
          elif printf '%s' "$PR_TITLE" | grep -qiE '\[skip-preview\]'; then
            SKIP=true
            REASON="PR title contains [skip-preview]"
          elif printf '%s' "$PR_BODY" | grep -qiE '\[skip-preview\]'; then
            SKIP=true
            REASON="PR body contains [skip-preview]"
          else
            HEAD_MSG=$(git log -1 --format=%B)
            if printf '%s' "$HEAD_MSG" | grep -qiE '\[skip-preview\]'; then
              SKIP=true
              REASON="head commit message contains [skip-preview]"
            fi
          fi

          echo "skip_preview=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "Skipping Shopify theme preview: $REASON"
            {
              echo "### Preview skipped"
              echo ""
              echo "$REASON"
              echo ""
              echo "Remove the \`skip-preview\` label / \`[skip-preview]\` marker to publish again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: dorny/paths-filter@v3
        id: paths
        if: steps.skip.outputs.skip_preview != 'true'
        with:
          filters: |
            theme:
              - 'assets/**'
              - 'blocks/**'
              - 'config/**'
              - 'layout/**'
              - 'locales/**'
              - 'sections/**'
              - 'snippets/**'
              - 'templates/**'
              - '_scripts/**'
              - '_styles/**'
              - 'shopify.theme.toml'
              - 'stores/**'

      - name: Decide whether to publish preview
        id: decide
        run: |
          SKIP="${{ steps.skip.outputs.skip_preview }}"
          THEME="${{ steps.paths.outputs.theme }}"
          if [ "$SKIP" = "true" ]; then
            echo "skip_preview=true" >> "$GITHUB_OUTPUT"
            echo "theme=false" >> "$GITHUB_OUTPUT"
          elif [ "$THEME" = "true" ]; then
            echo "skip_preview=false" >> "$GITHUB_OUTPUT"
            echo "theme=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_preview=false" >> "$GITHUB_OUTPUT"
            echo "theme=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve preview store targets from source branch
        id: resolve
        if: steps.decide.outputs.theme == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          node <<'NODE' >>"$GITHUB_OUTPUT"
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('climaybe.config.json', 'utf8'));
          const stores = cfg?.stores || {};
          const keys = Object.keys(stores);
          const baseRef = process.env.BASE_REF || '';
          const headRef = process.env.HEAD_REF || '';
          const branchRef = headRef || baseRef;
          const isMulti = keys.length > 1;
          const isStagingLive =
            branchRef && (/^staging-/.test(branchRef) || /^live-/.test(branchRef));

          const aliasToSecret = (a) => String(a).toUpperCase().replace(/-/g, '_');
          const normalizeDomain = (v) =>
            String(v || '')
              .toLowerCase()
              .replace(/^https?:\/\//, '')
              .replace(/\/.*$/, '');

          let targets = [];
          if (isMulti && !isStagingLive) {
            targets = keys.map((alias) => ({ alias, alias_secret: aliasToSecret(alias) }));
          } else if (isStagingLive) {
            let a = branchRef.replace(/^staging-/, '').replace(/^live-/, '');
            targets = [{ alias: a, alias_secret: aliasToSecret(a) }];
          } else {
            const defaultStoreNorm = normalizeDomain(cfg?.default_store);
            let alias = '';
            if (defaultStoreNorm) {
              for (const [k, d] of Object.entries(stores)) {
                if (normalizeDomain(d) === defaultStoreNorm) {
                  alias = k;
                  break;
                }
              }
            }
            if (!alias) alias = keys[0] || '';
            if (!alias && cfg?.default_store) {
              const sub = normalizeDomain(cfg.default_store).split('.')[0] || 'default';
              alias = sub.replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-') || 'default';
            }
            if (!alias) alias = 'default';
            targets = [{ alias, alias_secret: aliasToSecret(alias) }];
          }

          if (targets.length === 0 || targets.some((t) => !t.alias)) {
            console.error('Could not resolve store targets from climaybe.config.json');
            process.exit(1);
          }

          console.log('preview_targets_json<<PT_JSON');
          console.log(JSON.stringify(targets));
          console.log('PT_JSON');
          console.log(`store_alias=${targets[0].alias}`);
          console.log(`store_alias_secret=${targets[0].alias_secret}`);
          NODE

      - name: Install Shopify CLI
        if: steps.decide.outputs.theme == 'true'
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push development theme per store
        id: push
        if: steps.decide.outputs.theme == 'true'
        env:
          # Per-store scoped secrets (SHOPIFY_STORE_URL_<ALIAS>, ...) are looked up by
          # name at runtime, so all stores can be pushed from one job. Values stay masked.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          TARGETS_JSON: ${{ steps.resolve.outputs.preview_targets_json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f "layout/theme.liquid" ]; then
            echo "layout/theme.liquid not found. Ensure workflow runs at theme repository root."
            exit 1
          fi
          sec() { printf '%s' "$SECRETS_JSON" | jq -r --arg k "$1" '.[$k] // empty'; }
          SHOP_CLIENT_ID="$(sec SHOP_CLIENT_ID)"
          SHOP_CLIENT_SECRET="$(sec SHOP_CLIENT_SECRET)"
          SHOP_ACCESS_TOKEN="$(sec SHOP_ACCESS_TOKEN)"
          
          resolve_shopify_cli_token() {
            if [ -n "${SHOP_CLIENT_ID:-}" ] && [ -n "${SHOP_CLIENT_SECRET:-}" ]; then
              local resp token
              resp="$(curl -sS -f -X POST "https://${STORE_HOST}/admin/oauth/access_token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=client_credentials" \
                --data-urlencode "client_id=${SHOP_CLIENT_ID}" \
                --data-urlencode "client_secret=${SHOP_CLIENT_SECRET}")" || return 1
              token="$(printf '%s' "$resp" | jq -r '.access_token // empty')"
              if [ -z "$token" ] || [ "$token" = "null" ]; then
                echo "Client credentials response did not include access_token." >&2
                return 1
              fi
              printf '%s' "$token"; return 0
            fi
            if [ -n "${SHOPIFY_THEME_ACCESS_TOKEN:-}" ]; then printf '%s' "$SHOPIFY_THEME_ACCESS_TOKEN"; return 0; fi
            if [ -n "${SHOP_ACCESS_TOKEN:-}" ]; then printf '%s' "$SHOP_ACCESS_TOKEN"; return 0; fi
            return 1
          }

          mkdir -p "$RUNNER_TEMP/fragments"
          FAILED=0
          FIRST_ID=""; FIRST_OUT=""
          COUNT=$(printf '%s' "$TARGETS_JSON" | jq 'length')
          for i in $(seq 0 $((COUNT - 1))); do
            ALIAS="$(printf '%s' "$TARGETS_JSON" | jq -r ".[$i].alias")"
            ALIAS_SECRET="$(printf '%s' "$TARGETS_JSON" | jq -r ".[$i].alias_secret")"
            echo "::group::Store ${ALIAS}"
            SHOPIFY_STORE_URL="$(sec "SHOPIFY_STORE_URL_${ALIAS_SECRET}")"
            [ -n "$SHOPIFY_STORE_URL" ] || SHOPIFY_STORE_URL="$(sec SHOPIFY_STORE_URL)"
            SHOPIFY_THEME_ACCESS_TOKEN="$(sec "SHOPIFY_THEME_ACCESS_TOKEN_${ALIAS_SECRET}")"
            [ -n "$SHOPIFY_THEME_ACCESS_TOKEN" ] || SHOPIFY_THEME_ACCESS_TOKEN="$(sec SHOPIFY_THEME_ACCESS_TOKEN)"
            if [ -z "$SHOPIFY_STORE_URL" ]; then
              echo "Missing SHOPIFY_STORE_URL for ${ALIAS} (secret suffix ${ALIAS_SECRET})."
              FAILED=1; echo "::endgroup::"; continue
            fi
            STORE_HOST="${SHOPIFY_STORE_URL#https://}"; STORE_HOST="${STORE_HOST#http://}"; STORE_HOST="${STORE_HOST%%/*}"
            if ! CLI_TOKEN="$(resolve_shopify_cli_token)"; then
              echo "Missing Shopify auth for ${ALIAS}: set SHOP_CLIENT_ID+SHOP_CLIENT_SECRET (preferred), or legacy SHOPIFY_THEME_ACCESS_TOKEN / SHOP_ACCESS_TOKEN."
              FAILED=1; echo "::endgroup::"; continue
            fi
            echo "::add-mask::$CLI_TOKEN"

            # Isolated copy per store so stores/<alias>/ overlays never leak between stores.
            DIR="$RUNNER_TEMP/theme-${i}"
            rm -rf "$DIR"; mkdir -p "$DIR"
            tar --exclude=./.git -cf - . | tar -xf - -C "$DIR"
            STORE_DIR="$DIR/stores/${ALIAS}"
            if [ -d "$STORE_DIR" ]; then
              echo "Overlaying stores/${ALIAS}/ config, templates, and sections onto root..."
              for SUB in config templates sections; do
                [ -d "$STORE_DIR/$SUB" ] || continue
                (cd "$STORE_DIR" && find "$SUB" -name "*.json") | while read -r REL_PATH; do
                  [ "$REL_PATH" = "config/settings_schema.json" ] && continue
                  mkdir -p "$DIR/$(dirname "$REL_PATH")"
                  cp "$STORE_DIR/$REL_PATH" "$DIR/$REL_PATH"
                done
              done
            fi

            DEV_CONTEXT="climaybe-pr-$((10#${PR_NUMBER}))"
            ALIAS_SAFE="$(printf '%s' "$ALIAS" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')"
            if [ -n "$ALIAS_SAFE" ] && [ "$ALIAS_SAFE" != "default" ]; then DEV_CONTEXT="${DEV_CONTEXT}-${ALIAS_SAFE}"; fi
            echo "Pushing development theme with context: ${DEV_CONTEXT}"
            set +e
            OUTPUT="$(shopify theme push --path "$DIR" --store "$SHOPIFY_STORE_URL" --password "$CLI_TOKEN" \
              --development --development-context "$DEV_CONTEXT" --json 2>"$RUNNER_TEMP/err-${i}")"
            STATUS=$?
            set -e
            echo "$OUTPUT"; [ -s "$RUNNER_TEMP/err-${i}" ] && { echo "--- stderr ---"; cat "$RUNNER_TEMP/err-${i}"; }
            THEME_ID="$(printf '%s' "$OUTPUT" | jq -r '.theme.id // empty' 2>/dev/null || true)"
            if [ $STATUS -ne 0 ] || [ -z "$THEME_ID" ]; then
              echo "Theme push (development) failed for ${ALIAS}."
              FAILED=1; echo "::endgroup::"; continue
            fi
            jq -cn --arg alias "$ALIAS" --arg id "$THEME_ID" --arg host "$STORE_HOST" \
              '{alias:$alias, theme_id:$id, store_host:$host}' > "$RUNNER_TEMP/fragments/fragment-${ALIAS_SAFE:-store}.json"
            if [ -z "$FIRST_ID" ]; then FIRST_ID="$THEME_ID"; FIRST_OUT="$OUTPUT"; fi
            rm -rf "$DIR"
            echo "::endgroup::"
          done

          echo "theme_id=$FIRST_ID" >> "$GITHUB_OUTPUT"
          { echo "share_output<<SHARE_EOF"; echo "$FIRST_OUT"; echo "SHARE_EOF"; } >> "$GITHUB_OUTPUT"
          # Same semantics as the old fail-fast:false matrix: other stores still publish,
          # the run still fails if any store failed.
          exit $FAILED

      - name: Upload preview fragments
        if: always() && steps.decide.outputs.theme == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-fragment-all
          path: ${{ runner.temp }}/fragments/fragment-*.json
          if-no-files-found: ignore
          retention-days: 2

  comment-on-pr:
    needs: [preview]
    if: always() && needs.preview.outputs.theme == 'true' && needs.preview.outputs.theme_id != ''
    uses: ./.github/workflows/reusable-comment-on-pr.yml
    with:
      theme_id: ${{ needs.preview.outputs.theme_id }}
      share_output: ${{ needs.preview.outputs.share_output }}
      pr_number: ${{ needs.preview.outputs.pr_number }}
      store_alias: ${{ needs.preview.outputs.store_alias }}
      store_alias_secret: ${{ needs.preview.outputs.store_alias_secret }}
      use_preview_fragments: 'true'
    secrets: inherit
