# Push a development theme for one Shopify store (hidden from the main theme library),
# keyed by --development-context climaybe-pr-<n>[-<alias>]. Uploads a JSON fragment for PR comment fan-in.

name: Publish PR preview (single store)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
        description: "Unpadded PR number (e.g. 9) for development-context climaybe-pr-9"
      store_alias:
        required: true
        type: string
        description: "Store alias (for artifact naming, comment JSON, and multi-store context suffix)"
      store_alias_secret:
        required: false
        type: string
        default: ''
        description: "Upper snake-case secret suffix; empty uses default SHOPIFY_STORE_URL / theme token"
      checkout_ref:
        required: false
        type: string
        default: ''
        description: "Git ref/SHA to checkout (PR head). Empty uses the event default (pull_request head)."
    outputs:
      theme_id:
        description: "Development theme ID after push"
        value: ${{ jobs.publish.outputs.theme_id }}
      theme_name:
        description: "Theme name after push"
        value: ${{ jobs.publish.outputs.theme_name }}
      share_output:
        description: "Raw theme push JSON/output"
        value: ${{ jobs.publish.outputs.share_output }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      theme_id: ${{ steps.push.outputs.theme_id }}
      theme_name: ${{ steps.push.outputs.theme_name }}
      share_output: ${{ steps.push.outputs.share_output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Validate theme root
        run: |
          if [ ! -f "layout/theme.liquid" ]; then
            echo "layout/theme.liquid not found. Ensure workflow runs at theme repository root."
            exit 1
          fi

      - name: Sync stores/<alias>/ JSON to root for preview
        env:
          STORE_ALIAS: ${{ inputs.store_alias }}
        run: |
          ALIAS="${STORE_ALIAS}"
          if [ -z "$ALIAS" ]; then
            echo "No store alias provided; using root JSON as-is."
            exit 0
          fi
          STORE_DIR="stores/${ALIAS}"
          if [ ! -d "$STORE_DIR" ]; then
            echo "Store directory $STORE_DIR does not exist; using root JSON as-is."
            exit 0
          fi
          echo "Overlaying stores/${ALIAS}/ config, templates, and sections onto root..."
          for DIR in config templates sections; do
            SRC="${STORE_DIR}/${DIR}"
            if [ -d "$SRC" ]; then
              find "$SRC" -name "*.json" | while read -r FILE; do
                REL_PATH="${FILE#$STORE_DIR/}"
                if [ "$REL_PATH" = "config/settings_schema.json" ]; then
                  continue
                fi
                mkdir -p "$(dirname "$REL_PATH")"
                cp "$FILE" "$REL_PATH"
                echo "  Copied: $REL_PATH"
              done
            fi
          done

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push development theme
        id: push
        env:
          SHOPIFY_STORE_URL: ${{ inputs.store_alias_secret && secrets[format('SHOPIFY_STORE_URL_{0}', inputs.store_alias_secret)] || secrets.SHOPIFY_STORE_URL }}
          SHOP_CLIENT_ID: ${{ secrets.SHOP_CLIENT_ID }}
          SHOP_CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
          SHOPIFY_THEME_ACCESS_TOKEN: ${{ inputs.store_alias_secret && secrets[format('SHOPIFY_THEME_ACCESS_TOKEN_{0}', inputs.store_alias_secret)] || secrets.SHOPIFY_THEME_ACCESS_TOKEN }}
          SHOP_ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          STORE_ALIAS: ${{ inputs.store_alias }}
        run: |
          set -euo pipefail

          if [ -z "${SHOPIFY_STORE_URL:-}" ]; then
            echo "Missing SHOPIFY_STORE_URL."
            exit 1
          fi

          STORE_HOST="${SHOPIFY_STORE_URL#https://}"
          STORE_HOST="${STORE_HOST#http://}"
          STORE_HOST="${STORE_HOST%%/*}"

          resolve_shopify_cli_token() {
            if [ -n "${SHOP_CLIENT_ID:-}" ] && [ -n "${SHOP_CLIENT_SECRET:-}" ]; then
              local resp
              resp="$(curl -sS -f -X POST "https://${STORE_HOST}/admin/oauth/access_token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=client_credentials" \
                --data-urlencode "client_id=${SHOP_CLIENT_ID}" \
                --data-urlencode "client_secret=${SHOP_CLIENT_SECRET}")" || return 1
              local token
              token="$(printf '%s' "$resp" | jq -r '.access_token // empty')"
              if [ -z "$token" ] || [ "$token" = "null" ]; then
                echo "Client credentials response did not include access_token." >&2
                return 1
              fi
              printf '%s' "$token"
              return 0
            fi
            if [ -n "${SHOPIFY_THEME_ACCESS_TOKEN:-}" ]; then
              printf '%s' "$SHOPIFY_THEME_ACCESS_TOKEN"
              return 0
            fi
            if [ -n "${SHOP_ACCESS_TOKEN:-}" ]; then
              printf '%s' "$SHOP_ACCESS_TOKEN"
              return 0
            fi
            return 1
          }

          if ! CLI_TOKEN="$(resolve_shopify_cli_token)"; then
            echo "Missing Shopify auth: set SHOP_CLIENT_ID+SHOP_CLIENT_SECRET (preferred), or legacy SHOPIFY_THEME_ACCESS_TOKEN / SHOP_ACCESS_TOKEN."
            exit 1
          fi

          UNPADDED=$((10#${PR_NUMBER}))
          DEV_CONTEXT="climaybe-pr-${UNPADDED}"
          ALIAS_SAFE="$(printf '%s' "${STORE_ALIAS:-}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')"
          if [ -n "$ALIAS_SAFE" ] && [ "$ALIAS_SAFE" != "default" ]; then
            DEV_CONTEXT="${DEV_CONTEXT}-${ALIAS_SAFE}"
          fi

          echo "Pushing development theme with context: ${DEV_CONTEXT}"

          OUTPUT_FILE="$(mktemp)"
          ERR_FILE="$(mktemp)"
          set +e
          shopify theme push \
            --store "$SHOPIFY_STORE_URL" \
            --password "$CLI_TOKEN" \
            --development \
            --development-context "$DEV_CONTEXT" \
            --json \
            >"$OUTPUT_FILE" 2>"$ERR_FILE"
          STATUS=$?
          set -e

          OUTPUT="$(cat "$OUTPUT_FILE")"
          echo "$OUTPUT"
          if [ -s "$ERR_FILE" ]; then
            echo "--- stderr ---"
            cat "$ERR_FILE"
          fi
          if [ $STATUS -ne 0 ]; then
            echo "Theme push (development) failed."
            exit $STATUS
          fi

          THEME_ID="$(printf '%s' "$OUTPUT" | jq -r '.theme.id // empty' 2>/dev/null || true)"
          THEME_NAME="$(printf '%s' "$OUTPUT" | jq -r '.theme.name // empty' 2>/dev/null || true)"
          if [ -z "$THEME_ID" ]; then
            THEME_ID="$(printf '%s' "$OUTPUT" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1)"
          fi
          if [ -z "$THEME_ID" ]; then
            echo "Could not parse theme id from theme push JSON."
            exit 1
          fi

          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          echo "theme_name=${THEME_NAME:-$DEV_CONTEXT}" >> "$GITHUB_OUTPUT"
          {
            echo "share_output<<SHARE_EOF"
            echo "$OUTPUT"
            echo "SHARE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write preview fragment for PR comment
        env:
          STORE_ALIAS: ${{ inputs.store_alias }}
          THEME_ID: ${{ steps.push.outputs.theme_id }}
          SHOPIFY_STORE_URL: ${{ inputs.store_alias_secret && secrets[format('SHOPIFY_STORE_URL_{0}', inputs.store_alias_secret)] || secrets.SHOPIFY_STORE_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const alias = process.env.STORE_ALIAS || 'store';
          const safeAlias = alias.toLowerCase().replace(/[^a-z0-9_-]/g, '-');
          const fileName = `fragment-${safeAlias || 'store'}.json`;
          const url = (process.env.SHOPIFY_STORE_URL || '')
            .replace(/^https?:\/\//, '')
            .replace(/\/.*$/, '');
          const payload = {
            alias,
            theme_id: process.env.THEME_ID || '',
            store_host: url,
          };
          fs.writeFileSync(fileName, JSON.stringify(payload, null, 0));
          NODE

      - name: Upload preview fragment
        uses: actions/upload-artifact@v4
        with:
          name: preview-fragment-${{ inputs.store_alias }}
          path: fragment-*.json
          retention-days: 2
