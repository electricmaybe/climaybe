# climaybe — AI Changelog Generator (Reusable Workflow)
# Uses Gemini when GEMINI_API_KEY is set; otherwise (or on any request/response
# failure) falls back to a static changelog built from commit subjects.
# The step never fails because of the AI provider.

name: AI Changelog

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base ref (tag or commit) to collect commits from'
        required: true
        type: string
      head_ref:
        description: 'Head ref to collect commits to (default: HEAD)'
        required: false
        type: string
        default: 'HEAD'
      gemini_model:
        description: 'Gemini model id (default tracks the latest Flash alias)'
        required: false
        type: string
        default: 'gemini-flash-latest'
    outputs:
      changelog:
        description: 'Generated changelog in markdown format'
        value: ${{ jobs.generate.outputs.changelog }}
    secrets:
      GEMINI_API_KEY:
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.ai.outputs.changelog || steps.no_commits.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect commits
        id: commits
        run: |
          COMMITS=$(git log --pretty=format:"%h %s" ${{ inputs.base_ref }}..${{ inputs.head_ref }} 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "No commits found between ${{ inputs.base_ref }} and ${{ inputs.head_ref }}"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # File avoids huge env vars and shell escaping; jq reads via --rawfile (never use --argjson for raw log text).
          printf '%s\n' "$COMMITS" > commits-for-ai.txt
          echo "has_commits=true" >> $GITHUB_OUTPUT

      - name: Generate changelog (Gemini -> static fallback)
        id: ai
        if: steps.commits.outputs.has_commits == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: |
          # Any provider problem (DNS/network error, timeout, HTTP error, retired
          # model, empty or malformed JSON) must fall through to the static
          # changelog instead of failing the job.
          PROVIDER="static-fallback"
          CHANGELOG=""

          PROMPT=$(cat <<'PROMPT_EOF'
          You are a changelog generator for a Shopify theme repository.
          Given the following git commits, classify each into one of these categories:
          - **Features**: New functionality
          - **Fixes**: Bug fixes
          - **Improvements**: Enhancements to existing features
          - **Chore**: Maintenance, refactoring, docs

          Format the output as a markdown changelog. Group by category.
          Omit empty categories. Write concise, merchant-friendly descriptions.
          Do NOT include commit hashes in the output.

          Commits:
          PROMPT_EOF
          )

          if [ -n "${GEMINI_API_KEY:-}" ]; then
            MODEL="${GEMINI_MODEL:-gemini-flash-latest}"
            RESPONSE_FILE="$(mktemp)"
            PAYLOAD_FILE="$(mktemp)"
            if jq -n \
              --arg prompt "$PROMPT" \
              --rawfile commits commits-for-ai.txt \
              '{
                "contents": [{
                  "parts": [{"text": ($prompt + "\n" + $commits)}]
                }],
                "generationConfig": {
                  "temperature": 0.3,
                  "maxOutputTokens": 2048
                }
              }' > "$PAYLOAD_FILE"; then
              CURL_RC=0
              HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
                --connect-timeout 10 --max-time 60 \
                --retry 2 --retry-delay 3 \
                -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
                -H "Content-Type: application/json" \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                --data-binary @"$PAYLOAD_FILE") || CURL_RC=$?

              if [ "$CURL_RC" -ne 0 ]; then
                echo "::warning::Gemini request failed (curl exit ${CURL_RC}); using static changelog."
              elif [ "$HTTP_CODE" != "200" ]; then
                ERR_MSG=$(jq -r '.error.message // empty' "$RESPONSE_FILE" 2>/dev/null | head -c 300 || true)
                echo "::warning::Gemini returned HTTP ${HTTP_CODE} for model ${MODEL}${ERR_MSG:+: ${ERR_MSG}}; using static changelog."
              else
                CHANGELOG=$(jq -r '[.candidates[0].content.parts[]? | select(.thought != true) | .text // empty] | join("")' "$RESPONSE_FILE" 2>/dev/null || true)
                if [ -n "$CHANGELOG" ] && [ "$CHANGELOG" != "null" ]; then
                  PROVIDER="gemini"
                else
                  CHANGELOG=""
                  echo "::warning::Gemini response had no text; using static changelog."
                fi
              fi
            else
              echo "::warning::Could not build Gemini payload; using static changelog."
            fi
            rm -f "$RESPONSE_FILE" "$PAYLOAD_FILE"
          fi

          # Static fallback: group conventional-commit subjects, everything else under Chore.
          if [ -z "$CHANGELOG" ]; then
            FEATURES=""
            FIXES=""
            IMPROVEMENTS=""
            CHORES=""
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              SUBJECT="${line#* }"
              [ -z "$SUBJECT" ] && continue
              case "$SUBJECT" in
                feat:*|feat\(*|feat!:*) FEATURES="${FEATURES}- ${SUBJECT}"$'\n' ;;
                fix:*|fix\(*|fix!:*) FIXES="${FIXES}- ${SUBJECT}"$'\n' ;;
                perf:*|perf\(*|refactor:*|refactor\(*|style:*|style\(*) IMPROVEMENTS="${IMPROVEMENTS}- ${SUBJECT}"$'\n' ;;
                *) CHORES="${CHORES}- ${SUBJECT}"$'\n' ;;
              esac
            done < commits-for-ai.txt
            [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}## Features"$'\n'"${FEATURES}"$'\n'
            [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}## Fixes"$'\n'"${FIXES}"$'\n'
            [ -n "$IMPROVEMENTS" ] && CHANGELOG="${CHANGELOG}## Improvements"$'\n'"${IMPROVEMENTS}"$'\n'
            [ -n "$CHORES" ] && CHANGELOG="${CHANGELOG}## Chore"$'\n'"${CHORES}"
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="No changes detected."
            fi
            PROVIDER="static-fallback"
          fi

          echo "Changelog provider: $PROVIDER"

          # Write to output (multiline). Random delimiter so changelog text can't end the block early.
          DELIM="CHANGELOG_EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "changelog<<${DELIM}"
            printf '%s\n' "$CHANGELOG"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Fallback if no commits
        id: no_commits
        if: steps.commits.outputs.has_commits != 'true'
        run: |
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "No changes detected."
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT
