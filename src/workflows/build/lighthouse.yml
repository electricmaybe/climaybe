# climaybe — Lighthouse CI (Optional Build Package)
# Release gate only: runs ONLY on pull requests from `staging` into `main` (never drafts).
# Previously embedded in build-pipeline.yml and run on every push to `staging`.
# Opt out with `"lighthouse_workflows": false` in climaybe.config.json.

name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse-gate:
    # Release gate only: PR staging -> main, never drafts.
    if: github.event.pull_request.head.ref == 'staging' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run_lighthouse: ${{ steps.check.outputs.run_lighthouse }}
    env:
      SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
      SHOP_CLIENT_ID: ${{ secrets.SHOP_CLIENT_ID }}
      SHOP_CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
      SHOP_ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Lighthouse CI should run
        id: check
        run: |
          SKIP_REASONS=()
          # Lighthouse is opt-in via climaybe.config.json (lighthouse_workflows).
          # Default to enabled when the flag is absent (older configs).
          LH_ENABLED=$(node -e "try{process.stdout.write(require('./climaybe.config.json').lighthouse_workflows===false?'false':'true')}catch(e){process.stdout.write('true')}" 2>/dev/null || echo true)
          if [[ "$LH_ENABLED" != "true" ]]; then
            SKIP_REASONS+=("Lighthouse disabled in climaybe.config.json (lighthouse_workflows: false)")
          fi
          # Prefer Dev Dashboard client credentials; fall back to legacy Admin custom-app token.
          HAS_SHOP_AUTH=false
          if [ -n "$SHOP_CLIENT_ID" ] && [ -n "$SHOP_CLIENT_SECRET" ]; then
            HAS_SHOP_AUTH=true
          elif [ -n "$SHOP_ACCESS_TOKEN" ]; then
            HAS_SHOP_AUTH=true
          fi
          if [ -z "$SHOPIFY_STORE_URL" ] || [ "$HAS_SHOP_AUTH" != "true" ] || [ -z "$LHCI_GITHUB_APP_TOKEN" ]; then
            SKIP_REASONS+=("Missing required secrets: SHOPIFY_STORE_URL, LHCI_GITHUB_APP_TOKEN, and either SHOP_CLIENT_ID+SHOP_CLIENT_SECRET (Dev Dashboard) or legacy SHOP_ACCESS_TOKEN")
          fi
          if [ ${#SKIP_REASONS[@]} -gt 0 ]; then
            echo "run_lighthouse=false" >> $GITHUB_OUTPUT
            echo "Lighthouse CI skipped:"
            for reason in "${SKIP_REASONS[@]}"; do echo "  - $reason"; done
          else
            echo "run_lighthouse=true" >> $GITHUB_OUTPUT
          fi

  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: [lighthouse-gate]
    if: needs.lighthouse-gate.outputs.run_lighthouse == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lighthouse
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOPIFY_STORE_URL }}
          client_id: ${{ secrets.SHOP_CLIENT_ID }}
          client_secret: ${{ secrets.SHOP_CLIENT_SECRET }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
          password: ${{ secrets.SHOP_PASSWORD }}
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          lhci_min_score_performance: 0.9
          lhci_min_score_accessibility: 0.9
