# climaybe — Store QA manual checklist re-evaluation
# Only accepts edits to the bot-managed checklist comment (forge-safe).
# Completes the qa-manual check once every task box is ticked.

name: Store QA Manual

on:
  issue_comment:
    types: [edited]

jobs:
  qa-manual:
    name: qa-manual
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- climaybe-qa-manual -->') &&
      (
        github.event.comment.user.type == 'Bot' ||
        endsWith(github.event.comment.user.login, '[bot]') ||
        github.event.comment.user.login == 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: write
    steps:
      - name: Parse bot checklist + update qa-manual check
        uses: actions/github-script@v7
        env:
          QA_MANUAL_BODY: ${{ github.event.comment.body }}
          QA_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const body = process.env.QA_MANUAL_BODY || '';
            const commentId = process.env.QA_COMMENT_ID;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headSha = pr.data.head.sha;
            const shaMarker = `<!-- climaybe-qa-manual-sha:${headSha} -->`;
            if (!body.includes(shaMarker)) {
              core.info(`Ignoring checklist edit: body is not bound to current head SHA ${headSha}`);
              return;
            }

            // Confirm this is still the bot-managed comment id for this marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const managed = comments.filter(c => {
              const text = String(c.body || '');
              const bot = c.user?.type === 'Bot' || String(c.user?.login || '').endsWith('[bot]');
              return bot && text.includes('<!-- climaybe-qa-manual -->');
            });
            const canonical = managed.sort((a, b) => a.id - b.id).pop();
            if (!canonical || String(canonical.id) !== String(commentId)) {
              core.info('Ignoring checklist edit: not the canonical bot-managed comment');
              return;
            }

            const uncheckedIds = [];
            const uncheckedRe = /^- \[ \] \*\*([^*]+)\*\*/gm;
            const checkedRe = /^- \[x\] \*\*([^*]+)\*\*/gim;
            let m;
            while ((m = uncheckedRe.exec(body))) uncheckedIds.push(m[1]);
            let checked = 0;
            while ((m = checkedRe.exec(body))) checked += 1;
            let total = uncheckedIds.length + checked;
            if (total === 0) {
              const u = body.match(/^- \[ \] /gm) || [];
              const c = body.match(/^- \[x\] /gim) || [];
              total = u.length + c.length;
              checked = c.length;
              if (u.length) uncheckedIds.push(...u.map(() => '(item)'));
            }
            const complete = total > 0 && uncheckedIds.length === 0;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'qa-manual',
              head_sha: headSha,
              status: complete ? 'completed' : 'in_progress',
              conclusion: complete ? 'success' : undefined,
              output: {
                title: complete ? 'Manual QA complete' : 'Manual QA checklist pending',
                summary: complete
                  ? `All ${total} manual items checked.`
                  : `${total - checked} of ${total} manual item(s) remaining.`,
              },
            });
