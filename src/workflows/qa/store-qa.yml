# climaybe — Store QA (optional)
# Change-aware Playwright store tests against the PR preview URL.
# Opt in: "store_qa_workflows": true in climaybe.config.json + qa/config.yml in the theme repo.
#
# Runs ONLY on non-draft PRs whose base is main (single-store) or live-* (multi-store),
# after PR Update has finished for the latest head SHA.
# Secrets:
#   CURSOR_API_KEY (optional) — one Cursor cloud auto-fix round per head SHA; no-op when unset

name: Store QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'live-*']

concurrency:
  group: store-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa-auto:
    name: qa-auto
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    env:
      QA_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      QA_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      QA_PR_NUMBER: ${{ github.event.pull_request.number }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Gate — opt-in + base branch + qa/config
        id: gate
        run: |
          set +e
          npx --no-install climaybe store-qa gate --base-branch "$QA_BASE_BRANCH"
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Store QA skipped (not opted in, wrong base, or missing qa/config.yml)."
          fi

      - name: Wait for PR Update preview for this head SHA
        id: preview
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$QA_HEAD_SHA"
          PR_NUMBER="$QA_PR_NUMBER"
          echo "Waiting for workflow 'PR Update' success on $HEAD_SHA ..."
          PREVIEW_URL=""
          for i in $(seq 1 60); do
            # Find newest completed PR Update run for this head SHA
            RUN_JSON=$(gh run list --workflow "PR Update" --branch "${{ github.event.pull_request.head.ref }}" --limit 20 --json databaseId,headSha,conclusion,status,url 2>/dev/null || echo '[]')
            MATCH=$(node -e '
              const runs=JSON.parse(process.argv[1]||"[]");
              const sha=process.argv[2];
              const hit=runs.find(r=>r.headSha===sha);
              if(!hit){console.log(JSON.stringify({found:false}));process.exit(0)}
              console.log(JSON.stringify({found:true,status:hit.status,conclusion:hit.conclusion,id:hit.databaseId,url:hit.url}));
            ' "$RUN_JSON" "$HEAD_SHA")
            FOUND=$(node -e 'console.log(JSON.parse(process.argv[1]).found)' "$MATCH")
            STATUS=$(node -e 'const j=JSON.parse(process.argv[1]);console.log(j.status||"")' "$MATCH")
            CONC=$(node -e 'const j=JSON.parse(process.argv[1]);console.log(j.conclusion||"")' "$MATCH")
            if [ "$FOUND" = "true" ] && [ "$STATUS" = "completed" ]; then
              if [ "$CONC" != "success" ]; then
                echo "PR Update finished with conclusion=$CONC — cannot run store QA against a stale/missing preview."
                echo "preview_ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Extract preview URL from the climaybe preview PR comment for this head
              COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate)
              PREVIEW_URL=$(node -e '
                const comments=JSON.parse(process.argv[1]||"[]");
                const sha=process.argv[2];
                const mine=comments.filter(c => String(c.body||"").includes("<!-- climaybe-preview-comment -->"));
                const body=(mine[mine.length-1]||{}).body||"";
                if (sha && body && !body.includes(sha) && !body.includes(sha.slice(0,7))) {
                  // still accept if comment exists; head sha line may vary
                }
                const m=body.match(/https?:\/\/[^\s)]+/g)||[];
                const preview=m.find(u=>/preview_theme_id=|\/\?preview_theme_id=|myshopify\.com/i.test(u))||m[0]||"";
                process.stdout.write(preview);
              ' "$COMMENTS" "$HEAD_SHA")
              echo "preview_ready=true" >> "$GITHUB_OUTPUT"
              echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              echo "Found preview: $PREVIEW_URL"
              exit 0
            fi
            echo "Attempt $i/60: preview not ready yet (found=$FOUND status=$STATUS)..."
            sleep 20
          done
          echo "Timed out waiting for PR Update."
          echo "preview_ready=false" >> "$GITHUB_OUTPUT"

      - name: Select at-risk tests
        id: select
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          npx --no-install climaybe store-qa select --base "$BASE_REF" --base-branch "$QA_BASE_BRANCH" --head-branch "$QA_HEAD_BRANCH" > qa-results/selection.stdout.json || true
          if [ ! -f qa-results/selection.json ]; then
            echo '{"scope":"small","tags":["@funnel","@purchase"],"grep":"@funnel|@purchase","browserProjects":["mobile-webkit","desktop-chromium"],"skipBrowser":false}' > qa-results/selection.json
          fi
          SKIP=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write(s.skipBrowser?"true":"false")')
          GREP=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write(s.grep||"@funnel")')
          PROJECTS=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write((s.browserProjects||[]).join(","))')
          echo "skip_browser=$SKIP" >> "$GITHUB_OUTPUT"
          echo "grep=$GREP" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true' && steps.select.outputs.skip_browser != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-webkit-chromium

      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true' && steps.select.outputs.skip_browser != 'true'
        run: |
          npx --no-install playwright install --with-deps webkit chromium || npx playwright install --with-deps webkit chromium

      - name: Run selected Playwright tests
        id: pw
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true' && steps.select.outputs.skip_browser != 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          QA_THEME_ROOT: ${{ github.workspace }}
          QA_PROJECTS: ${{ steps.select.outputs.projects }}
        run: |
          set +e
          CONFIG=$(node -e '
            const fs=require("fs");const path=require("path");
            const candidates=[
              "node_modules/climaybe/src/qa/playwright/playwright.config.js",
              path.join(process.env.npm_config_prefix||"","lib/node_modules/climaybe/src/qa/playwright/playwright.config.js"),
            ];
            // Resolve via createRequire from climaybe package
            try {
              const {createRequire}=require("module");
              const req=createRequire(path.join(process.cwd(),"package.json"));
              const pkg=path.dirname(req.resolve("climaybe/package.json"));
              console.log(path.join(pkg,"src/qa/playwright/playwright.config.js"));
            } catch {
              console.log(candidates[0]);
            }
          ')
          # Also include project specs if present
          EXTRA=""
          if [ -d qa/specs ]; then EXTRA="qa/specs"; fi
          npx --no-install playwright test -c "$CONFIG" --grep "${{ steps.select.outputs.grep }}" $EXTRA
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build auto report comment
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        env:
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npx --no-install climaybe store-qa report --head-sha "$QA_HEAD_SHA" || true

      - name: Upsert qa-auto PR comment
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- climaybe-qa-auto -->';
            const body = fs.existsSync('qa-results/auto-comment.md')
              ? fs.readFileSync('qa-results/auto-comment.md', 'utf8')
              : `${marker}\n## Store QA — automated results\n\n_No report generated._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build + upsert manual checklist comment
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        env:
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          npx --no-install climaybe store-qa manual --head-sha "$QA_HEAD_SHA" --preview-url "$QA_PREVIEW_URL" > /tmp/manual-out.md || true
        # upsert via github-script below

      - name: Upsert qa-manual PR comment + pending check
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- climaybe-qa-manual -->';
            const body = fs.existsSync('qa-results/manual.md')
              ? fs.readFileSync('qa-results/manual.md', 'utf8')
              : `${marker}\n## Store QA — manual checklist\n\n- [x] No manual checks required`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Pending qa-manual check until boxes are ticked (re-eval on comment edit workflow)
            const unchecked = (body.match(/^- \[ \] /gm) || []).length;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'qa-manual',
              head_sha: process.env.QA_HEAD_SHA,
              status: unchecked === 0 ? 'completed' : 'in_progress',
              conclusion: unchecked === 0 ? 'success' : undefined,
              output: {
                title: unchecked === 0 ? 'Manual QA complete' : 'Manual QA checklist pending',
                summary: unchecked === 0
                  ? 'All manual checklist items are checked.'
                  : `${unchecked} manual item(s) remaining. Tick boxes on the Store QA manual checklist comment.`,
              },
            });

      - name: Auto-fix round (optional CURSOR_API_KEY)
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true' && steps.pw.outputs.failed == 'true'
        env:
          QA_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          QA_PR_URL: ${{ github.event.pull_request.html_url }}
          QA_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" --paginate)
          export QA_PRIOR_COMMENTS="$COMMENTS"
          RESULT=$(npx --no-install climaybe store-qa autofix --head-sha "$QA_HEAD_SHA" || true)
          echo "$RESULT"
          MARKER=$(node -e 'try{const j=JSON.parse(process.argv[1]);if(j.marker)console.log(j.marker)}catch{}' "$RESULT")
          if [ -n "$MARKER" ]; then
            gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" -f body="<!-- ${MARKER} -->"$'\n'"Store QA auto-fix agent launched for \`$QA_HEAD_SHA\`. Exactly one attempt per head SHA. Never auto-merges."
          fi
          # Refresh auto comment with autofix status
          REASON=$(node -e 'try{const j=JSON.parse(process.argv[1]);console.log(j.skipped?(j.reason||"skipped"):(j.ok?"triggered":"error"))}catch{console.log("error")}' "$RESULT")
          case "$REASON" in
            triggered) AF=triggered ;;
            missing-secret) AF=skipped-missing-secret ;;
            already-ran) AF=skipped-already-ran ;;
            no-failures) AF=skipped-no-failures ;;
            *) AF=skipped-missing-secret ;;
          esac
          npx --no-install climaybe store-qa report --head-sha "$QA_HEAD_SHA" --autofix "$AF" || true

      - name: Upload Playwright artifacts
        if: always() && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: store-qa-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            qa-results/
          if-no-files-found: ignore

      - name: Fail job when tests failed
        if: steps.pw.outputs.failed == 'true'
        run: |
          echo "Store QA automated tests failed (qa-auto)."
          exit 1

      - name: Fail when preview never became ready
        if: steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready != 'true'
        run: |
          echo "Preview was not ready for this head SHA; qa-auto fails closed."
          exit 1
