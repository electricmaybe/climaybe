# climaybe — Store QA (optional)
# Change-aware Playwright store tests against the PR preview URL.
# Opt in: "store_qa_workflows": true in climaybe.config.json + qa/config.yml in the theme repo.
#
# Triggered by workflow_run after PR Update succeeds (no busy-wait).
# Runs ONLY for non-draft PRs whose base is main (single-store) or live-* (multi-store).
# Secrets:
#   CURSOR_API_KEY (optional) — one Cursor cloud auto-fix round per PR; no-op when unset

name: Store QA

on:
  workflow_run:
    workflows: ['PR Update']
    types: [completed]

concurrency:
  group: store-qa-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  qa-auto:
    name: qa-auto
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: Resolve PR context from PR Update run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            const headBranch = run.head_branch;
            let pr = (run.pull_requests || [])[0] || null;
            if (!pr) {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${headBranch}`,
                per_page: 10,
              });
              pr = pulls.find(p => p.head.sha === headSha) || pulls[0] || null;
            }
            if (!pr) {
              core.setOutput('run', 'false');
              core.setOutput('reason', 'no-open-pr');
              console.log('No open PR for this PR Update run; skipping Store QA.');
              return;
            }
            const full = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const data = full.data;
            if (data.draft) {
              core.setOutput('run', 'false');
              core.setOutput('reason', 'draft');
              console.log('PR is draft; skipping Store QA.');
              return;
            }
            core.setOutput('run', 'true');
            core.setOutput('pr_number', String(data.number));
            core.setOutput('head_sha', data.head.sha);
            core.setOutput('head_branch', data.head.ref);
            core.setOutput('base_branch', data.base.ref);
            core.setOutput('pr_url', data.html_url);

      - name: Checkout PR head
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.pr.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.run == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Gate — opt-in + base branch + qa/config
        id: gate
        if: steps.pr.outputs.run == 'true'
        env:
          QA_BASE_BRANCH: ${{ steps.pr.outputs.base_branch }}
        run: |
          set +e
          npx --no-install climaybe store-qa gate --base-branch "$QA_BASE_BRANCH"
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Store QA skipped (not opted in, wrong base, or missing qa/config.yml)."
          fi

      - name: Select tests + resolve preview URL for this head SHA (fail closed)
        id: preview
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          QA_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          QA_BASE_BRANCH: ${{ steps.pr.outputs.base_branch }}
          QA_HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          set -euo pipefail
          mkdir -p qa-results
          git fetch origin "$QA_BASE_BRANCH" --depth=1 || true
          BASE_REF="origin/${QA_BASE_BRANCH}"
          npx --no-install climaybe store-qa select \
            --base "$BASE_REF" \
            --base-branch "$QA_BASE_BRANCH" \
            --head-branch "$QA_HEAD_BRANCH" || true
          if [ ! -f qa-results/selection.json ]; then
            echo '{"scope":"small","tags":["@funnel","@purchase"],"grep":"@funnel|@purchase","browserProjects":["mobile-webkit","desktop-chromium"],"skipBrowser":false}' > qa-results/selection.json
          fi
          STORE_ALIAS=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write(s.storeAlias||"")')
          echo "store_alias=$STORE_ALIAS" >> "$GITHUB_OUTPUT"
          GREP=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write(s.grep||"@funnel")')
          PROJECTS=$(node -e 'const s=require("./qa-results/selection.json");process.stdout.write((s.browserProjects||[]).join(","))')
          echo "grep=$GREP" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" --paginate)
          PREVIEW_URL=$(QA_PR_COMMENTS="$COMMENTS" QA_HEAD_SHA="$QA_HEAD_SHA" QA_STORE_ALIAS="$STORE_ALIAS" \
            npx --no-install climaybe store-qa resolve-preview)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "preview_ready=true" >> "$GITHUB_OUTPUT"
          echo "Found preview for $QA_HEAD_SHA ($STORE_ALIAS): $PREVIEW_URL"

      - name: Cache Playwright browsers
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-webkit-chromium

      - name: Install Playwright browsers
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        run: |
          npx --no-install playwright install --with-deps webkit chromium || npx playwright install --with-deps webkit chromium

      - name: Run selected Playwright tests
        id: pw
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          QA_THEME_ROOT: ${{ github.workspace }}
          QA_PROJECTS: ${{ steps.preview.outputs.projects }}
          QA_STORE_ALIAS: ${{ steps.preview.outputs.store_alias }}
          QA_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set +e
          CONFIG=$(node -e '
            const path=require("path");
            try {
              const {createRequire}=require("module");
              const req=createRequire(path.join(process.cwd(),"package.json"));
              const pkg=path.dirname(req.resolve("climaybe/package.json"));
              console.log(path.join(pkg,"src/qa/playwright/playwright.config.js"));
            } catch {
              console.log("node_modules/climaybe/src/qa/playwright/playwright.config.js");
            }
          ')
          EXTRA=""
          if [ -d qa/specs ]; then EXTRA="qa/specs"; fi
          npx --no-install playwright test -c "$CONFIG" --grep "${{ steps.preview.outputs.grep }}" $EXTRA
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build auto report comment
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        env:
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          npx --no-install climaybe store-qa report --head-sha "$QA_HEAD_SHA" || true

      - name: Upsert qa-auto PR comment
        id: upsert_auto
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/github-script@v7
        env:
          QA_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- climaybe-qa-auto -->';
            const body = fs.existsSync('qa-results/auto-comment.md')
              ? fs.readFileSync('qa-results/auto-comment.md', 'utf8')
              : `${marker}\n## Store QA — automated results\n\n_No report generated._`;
            const issue_number = Number(process.env.QA_PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => {
              const bot = c.user?.type === 'Bot' || String(c.user?.login || '').endsWith('[bot]');
              return bot && (c.body || '').includes(marker);
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.setOutput('comment_id', String(existing.id));
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              core.setOutput('comment_id', String(created.data.id));
            }

      - name: Upsert qa-manual PR comment + pending check
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/github-script@v7
        env:
          QA_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          QA_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const marker = '<!-- climaybe-qa-manual -->';
            const issue_number = Number(process.env.QA_PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => {
              const bot = c.user?.type === 'Bot' || String(c.user?.login || '').endsWith('[bot]');
              return bot && (c.body || '').includes(marker);
            });
            const previousBody = existing?.body || '';
            execFileSync('npx', ['--no-install', 'climaybe', 'store-qa', 'manual',
              '--head-sha', process.env.QA_HEAD_SHA,
              '--preview-url', process.env.QA_PREVIEW_URL || '',
            ], {
              env: { ...process.env, QA_PREVIOUS_MANUAL_BODY: previousBody },
              stdio: 'inherit',
            });
            const body = fs.existsSync('qa-results/manual.md')
              ? fs.readFileSync('qa-results/manual.md', 'utf8')
              : `${marker}\n<!-- climaybe-qa-manual-sha:${process.env.QA_HEAD_SHA} -->\n## Store QA — manual checklist\n\n- [x] No manual checks required`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.setOutput('manual_comment_id', String(existing.id));
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              core.setOutput('manual_comment_id', String(created.data.id));
            }

            const unchecked = (body.match(/^- \[ \] /gm) || []).length;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'qa-manual',
              head_sha: process.env.QA_HEAD_SHA,
              status: unchecked === 0 ? 'completed' : 'in_progress',
              conclusion: unchecked === 0 ? 'success' : undefined,
              output: {
                title: unchecked === 0 ? 'Manual QA complete' : 'Manual QA checklist pending',
                summary: unchecked === 0
                  ? 'All manual checklist items are checked.'
                  : `${unchecked} manual item(s) remaining. Tick boxes on the Store QA manual checklist comment.`,
              },
            });

      - name: Auto-fix round (optional CURSOR_API_KEY, once per PR)
        id: autofix
        if: steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true' && steps.pw.outputs.failed == 'true'
        env:
          QA_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          QA_PR_URL: ${{ steps.pr.outputs.pr_url }}
          QA_HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          QA_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          QA_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          QA_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" --paginate)
          export QA_PRIOR_COMMENTS="$COMMENTS"
          RESULT=$(npx --no-install climaybe store-qa autofix --head-sha "$QA_HEAD_SHA" || true)
          echo "$RESULT"
          echo "$RESULT" > qa-results/autofix-stdout.json
          REASON=$(node -e 'try{const j=JSON.parse(process.argv[1]);console.log(j.reason||(j.ok&&!j.skipped?"triggered":"error"))}catch{console.log("error")}' "$RESULT")
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          case "$REASON" in
            triggered) AF=triggered ;;
            missing-secret) AF=skipped-missing-secret ;;
            already-ran) AF=skipped-already-ran ;;
            failed-still) AF=failed-still ;;
            no-failures) AF=skipped-no-failures ;;
            *) AF=skipped-missing-secret ;;
          esac
          echo "autofix_status=$AF" >> "$GITHUB_OUTPUT"
          if [ "$REASON" = "triggered" ]; then
            gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" -f body="<!-- climaybe-qa-autofix-attempted -->"$'\n'"Store QA auto-fix agent launched for this PR (head \`$QA_HEAD_SHA\`). **Exactly one attempt per PR.** After the agent pushes, tests re-run; if they still fail, owner action is required. Never auto-merges."
          fi
          if [ "$REASON" = "failed-still" ]; then
            gh api "repos/${{ github.repository }}/issues/${QA_PR_NUMBER}/comments" -f body="<!-- climaybe-qa-autofix-failed-still -->"$'\n'"## Store QA — owner action required"$'\n\n'"Auto-fix already ran once on this PR and automated tests are still failing on \`$QA_HEAD_SHA\`. No further agents will be launched. Please inspect the qa-auto report and artifacts."
          fi
          npx --no-install climaybe store-qa report --head-sha "$QA_HEAD_SHA" --autofix "$AF" || true

      - name: Re-upsert qa-auto comment after autofix status
        if: always() && steps.autofix.outputs.autofix_status != ''
        uses: actions/github-script@v7
        env:
          QA_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('qa-results/auto-comment.md')) return;
            const marker = '<!-- climaybe-qa-auto -->';
            const body = fs.readFileSync('qa-results/auto-comment.md', 'utf8');
            const issue_number = Number(process.env.QA_PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => {
              const bot = c.user?.type === 'Bot' || String(c.user?.login || '').endsWith('[bot]');
              return bot && (c.body || '').includes(marker);
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Upload Playwright artifacts
        if: always() && steps.pr.outputs.run == 'true' && steps.gate.outputs.run == 'true' && steps.preview.outputs.preview_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: store-qa-${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.head_sha }}
          path: |
            qa-results/
          if-no-files-found: ignore

      - name: Fail job when tests failed
        if: steps.pw.outputs.failed == 'true'
        run: |
          echo "Store QA automated tests failed (qa-auto)."
          exit 1
